<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLINPRO 105</title>
<style>
body{background:#0F2C59;color:white;font-family:sans-serif;padding:20px;text-align:center}
.card{background:white;color:black;padding:20px;border-radius:20px;margin-top:20px;text-align:left}
button{width:100%;padding:18px;background:#00B69B;color:white;border:0;border-radius:12px;font-size:18px;font-weight:bold;margin-top:15px}
select{width:100%;padding:12px;border-radius:10px;margin-top:5px}
</style>
</head>
<body>
<h1>KLINPRO</h1>
<p>105 Pekerja - 5 Team</p>

<div id="login" class="card">
<b>Login Demo</b><br><br>
Team
<select id="team">
<option>TEAM A - HOTEL (25 org)</option>
<option>TEAM B - MALL (25 org)</option>
<option>TEAM C - PABRIK 1 (25 org)</option>
<option>TEAM D - PABRIK 2 (25 org)</option>
<option>TEAM E - KANTOR (5 org)</option>
</select><br><br>
Nama
<select><option>Siti - Pekerja 01</option><option>Budi - Pekerja 26</option></select>
<button onclick="masuk()">MASUK KE APLIKASI (KLIK INI)</button>
<p style="font-size:11px">Gaji Rp 2.200.000 - Telat Rp 10.000</p>
</div>

<div id="app" class="card" style="display:none">
<h3 id="judulTeam">Halo Pekerja</h3>
<p id="gps">📍 GPS: Mendeteksi...</p>
<button onclick="absen()">ABSEN MASUK ✅</button>
<p>Upload Foto: <input type="file" accept="image/*" capture="camera"></p>
<hr>
<b>Slip Gaji Sept 2026</b><br>
Pokok: Rp 2.200.000<br>
Telat: -Rp 20.000<br>
<h2 style="color:#00B69B">Bersih: Rp 2.180.000</h2>
</div>

<script>
function masuk(){
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='block';
 let t = document.getElementById('team').value;
 document.getElementById('judulTeam').innerText='Halo Pekerja - '+t;
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
   document.getElementById('gps').innerText='📍 Valid di '+t+' Akurasi '+p.coords.accuracy.toFixed(0)+'m ✅';
  });
 }
}
function absen(){ alert('ABSEN BERHASIL! Team: '+document.getElementById('team').value+' - Gaji aman Rp 2.2jt terkirim ke Admin'); }
</script>
</body>
</html>
