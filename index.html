<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>KLINPRO 105 - LIVE DB</title>
<style>body{background:#0F2C59;color:white;font-family:sans-serif;padding:20px;text-align:center}.card{background:white;color:black;padding:20px;border-radius:20px;margin-top:20px;text-align:left}button{width:100%;padding:18px;background:#00B69B;color:white;border:0;border-radius:12px;font-size:18px;font-weight:bold;margin-top:15px}select,input{width:100%;padding:12px;border-radius:10px;margin-top:5px;border:1px solid #ccc}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<h1>KLINPRO</h1><p>105 Pekerja - DB Connected</p>
<div id="login" class="card"><b>Login Karyawan</b><br><br>Team<select id="team"><option>TEAM A - HOTEL (25 org)</option><option>TEAM B - MALL (25 org)</option><option>TEAM C - PABRIK 1 (25 org)</option><option>TEAM D - PABRIK 2 (25 org)</option><option>TEAM E - KANTOR (5 org)</option></select><br><br>Nama<input id="workerName" value="Siti - 01"><button onclick="masuk()">MASUK & CEK GPS</button></div>
<div id="app" class="card" style="display:none"><h3 id="judulTeam">Halo</h3><p id="gps">📍 Mendeteksi...</p><button onclick="absen()">ABSEN MASUK KE DATABASE ✅</button><p>Foto Before-After: <input type="file" accept="image/*" capture="camera"></p></div>
<script>
const SUPABASE_URL = 'https://slzfussqjothztqabesb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsemZ1c3Nxam90aHp0cWFiZXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDMxMDEsImV4cCI6MjEwNTA3OTEwMX0.KchTF1zGPjtBlw560axOuS7pnrVqeJq6SwHsAUfAMFg';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function masuk(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';let t=document.getElementById('team').value;document.getElementById('judulTeam').innerText='Halo '+document.getElementById('workerName').value+' - '+t;if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{document.getElementById('gps').innerText='📍 Valid Akurasi '+p.coords.accuracy.toFixed(0)+'m ✅';window.lastGps=p.coords.latitude+','+p.coords.longitude;});}}
async function absen(){let team=document.getElementById('team').value;let nama=document.getElementById('workerName').value;let gps=window.lastGps||'GPS off';const {error}=await supabaseClient.from('attendance').insert([{nama,team,gps,status:'HADIR'}]);if(error)alert('Gagal DB: '+error.message+' - Cek SQL RLS sudah di RUN belum');else alert('BERHASIL! '+nama+' absen masuk DB. Cek Supabase Table attendance');}
</script></body></html>
