<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLINPRO Selfie</title>
<style>body{background:#0F2C59;color:#fff;font-family:sans-serif;padding:15px;text-align:center}.card{background:#fff;color:#000;padding:18px;border-radius:18px;margin-top:15px;text-align:left}button{width:100%;padding:16px;background:#00B69B;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:10px}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-top:5px}#preview{width:100%;border-radius:12px;margin-top:10px;display:none}</style></head><body>
<h2>KLINPRO - Absen + Selfie</h2>
<div class="card">
<b>Team</b><select id="team"><option>TEAM A - HOTEL</option><option>TEAM B - MALL</option><option>TEAM C - PABRIK 1</option><option>TEAM D - PABRIK 2</option><option>TEAM E - KANTOR</option></select><br><br>
<b>Nama</b><input id="nama" value="Siti - 01"><br><br>
<b>Selfie Wajib</b><br>
<input type="file" accept="image/*" capture="user" id="foto" onchange="show(this)">
<img id="preview"><br>
<b id="gps">📍 GPS: belum</b>
<button onclick="cekGPS()">1. CEK GPS</button>
<button onclick="absen()">2. ABSEN + FOTO</button>
<p id="status"></p>
</div>
<script>
const SUPA_URL='https://slzfussqjothztqabesb.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsemZ1c3Nxam90aHp0cWFiZXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDMxMDEsImV4cCI6MjEwNTA3OTEwMX0.KchTF1zGPjtBlw560axOuS7pnrVqeJq6SwHsAUfAMFg';
let lastGps='0,0'; let fotoBase64='';
function show(input){
 if(input.files[0]){
  let r=new FileReader();
  r.onload=e=>{fotoBase64=e.target.result; document.getElementById('preview').src=fotoBase64; document.getElementById('preview').style.display='block';}
  r.readAsDataURL(input.files[0]);
 }
}
function cekGPS(){
 navigator.geolocation.getCurrentPosition(p=>{lastGps=p.coords.latitude+','+p.coords.longitude; document.getElementById('gps').innerText='📍 GPS OK '+lastGps; document.getElementById('status').innerText='GPS siap';});
}
async function absen(){
 if(!fotoBase64){alert('Foto selfie dulu!'); return;}
 let team=document.getElementById('team').value; let nama=document.getElementById('nama').value;
 document.getElementById('status').innerText='Upload foto & absen...';
 // upload foto ke storage
 let blob=await (await fetch(fotoBase64)).blob();
 let fileName=Date.now()+'_'+nama.replace(/\s+/g,'_')+'.jpg';
 let fd=new FormData(); fd.append('file',blob,fileName);
 try{
  // 1. upload foto
  let up=await fetch(SUPA_URL+'/storage/v1/object/foto-absen/'+fileName, {method:'POST', headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}, body:fd});
  let fotoUrl = SUPA_URL+'/storage/v1/object/public/foto-absen/'+fileName;
  // 2. simpan absen
  let res=await fetch(SUPA_URL+'/rest/v1/attendance',{method:'POST', headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'}, body:JSON.stringify({nama,team,gps:lastGps,status:'HADIR',foto_url:fotoUrl})});
  if(res.ok){document.getElementById('status').innerText='✅ BERHASIL! Selfie tersimpan'; alert('BERHASIL ABSEN '+nama);}
  else{let t=await res.text(); document.getElementById('status').innerText='Gagal DB: '+t; alert(t);}
 }catch(e){document.getElementById('status').innerText='Error: '+e.message;}
}
</script></body></html>
