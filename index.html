<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>KLINPRO 105</title>
<style>body{background:#0F2C59;color:white;font-family:sans-serif;padding:20px;text-align:center}.card{background:white;color:#000;padding:20px;border-radius:20px;margin-top:20px;text-align:left}button{width:100%;padding:18px;background:#00B69B;color:white;border:0;border-radius:12px;font-size:18px;font-weight:bold;margin-top:15px}select,input{width:100%;padding:12px;border-radius:10px;margin-top:5px;border:1px solid #ccc}</style></head><body>
<h1>KLINPRO - DB FIX</h1><div class="card"><b>Team</b><select id="team"><option>TEAM A - HOTEL</option><option>TEAM B - MALL</option><option>TEAM C - PABRIK 1</option><option>TEAM D - PABRIK 2</option><option>TEAM E - KANTOR</option></select><br><br><b>Nama</b><input id="workerName" value="Siti - 01"><br><br><b id="gps">📍 GPS belum aktif</b><button onclick="masuk()">CEK GPS</button><button onclick="absen()">ABSEN MASUK DB</button><p id="status"></p></div>
<script>
const URL = 'https://slzfussqjothztqabesb.supabase.co/rest/v1/attendance';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsemZ1c3Nxam90aHp0cWFiZXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDMxMDEsImV4cCI6MjEwNTA3OTEwMX0.KchTF1zGPjtBlw560axOuS7pnrVqeJq6SwHsAUfAMFg';

function masuk(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
   document.getElementById('gps').innerText='📍 GPS OK '+p.coords.latitude.toFixed(4);
   window.lastGps = p.coords.latitude+','+p.coords.longitude;
   document.getElementById('status').innerText='GPS siap';
  });
 } else { document.getElementById('status').innerText='GPS tidak support'; }
}

async function absen(){
 let team=document.getElementById('team').value;
 let nama=document.getElementById('workerName').value;
 let gps=window.lastGps||'0,0';
 document.getElementById('status').innerText='Mengirim...';
 try{
  let res = await fetch(URL, {
   method:'POST',
   headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
   body: JSON.stringify({nama,team,gps,status:'HADIR'})
  });
  if(res.ok){ document.getElementById('status').innerText='✅ BERHASIL MASUK DB! Cek Supabase'; alert('BERHASIL '+nama); }
  else { let t=await res.text(); document.getElementById('status').innerText='Gagal: '+t; alert('Gagal DB: '+t); }
 }catch(e){ document.getElementById('status').innerText='Error: '+e.message; }
}
</script></body></html>
